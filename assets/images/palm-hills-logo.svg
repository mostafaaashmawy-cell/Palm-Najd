<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <!-- Diamond Emblem -->
  <g transform="translate(10, 5)">
    <!-- Main Diamond background in signature Palm Hills Crimson -->
    <rect x="18" y="18" width="34" height="34" rx="2" transform="rotate(45 35 35)" fill="#9E1B21"/>
    
    <!-- Stylized Chevron Palm Fronds (Quadrant cuts) -->
    <!-- Top Fronds -->
    <path d="M35 15 L35 27 M30 21 L35 26 L40 21 M27 25 L35 33 L43 25" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Fronds -->
    <path d="M35 55 L35 43 M30 49 L35 44 L40 49 M27 45 L35 37 L43 45" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Fronds -->
    <path d="M15 35 L27 35 M21 30 L26 35 L21 40 M25 27 L33 35 L25 43" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Fronds -->
    <path d="M55 35 L43 35 M49 30 L44 35 L49 40 M45 27 L37 35 L45 43" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: PALM HILLS -->
  <text x="88" y="44" font-family="'Montserrat', 'Cinzel', 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" letter-spacing="4.5" fill="#141416">PALM HILLS</text>
  <text x="89" y="58" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="500" letter-spacing="4.2" fill="#8C6D3B">DEVELOPMENTS</text>
</svg>
